name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set manifest version from tag
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));m.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n')"
      - name: Lint (AMO addons-linter)
        run: npx --yes web-ext lint --source-dir .
      - name: Package (zip serves both Chrome and Firefox)
        run: |
          npx --yes web-ext build --source-dir . --artifacts-dir dist \
            --ignore-files safari scripts .github .git .DS_Store AppIcon.icon web-ext-config.json dist
          mv dist/*.zip "dist/better-github-draft-button-${GITHUB_REF_NAME}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME" \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber

  publish-firefox:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set manifest version from tag
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));m.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n')"
      - name: Check if version already on AMO
        id: check
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" node scripts/amo-check-version.mjs
      - name: Publish to AMO (listed channel)
        if: steps.check.outputs.exists != 'true'
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: npx --yes web-ext sign --source-dir . --api-key "$AMO_API_KEY" --api-secret "$AMO_API_SECRET" --channel listed

  publish-chrome:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - name: Publish to Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
          VERSION: ${{ github.ref_name }}
        run: EXTENSION_ZIP="$(ls dist/*.zip)" VERSION="${VERSION#v}" node scripts/publish-chrome.mjs
